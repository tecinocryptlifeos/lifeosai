<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LifeOS Trading Intelligence</title>
  <meta name="description" content="LifeOS Trading Intelligence demo trading environment. Simulation only.">
  <style>
    :root{color-scheme:dark}
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1020;color:#eef2ff}
    main{width:min(720px,calc(100% - 40px));padding:36px;box-sizing:border-box;border:1px solid #26304a;border-radius:20px;background:#11182a}
    h1{margin:0 0 12px;font-size:clamp(28px,5vw,44px)}
    p{line-height:1.6;color:#b9c2d9}
    a{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:10px;background:#eef2ff;color:#11182a;text-decoration:none;font-weight:700}
    .badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#1b2640;color:#aebce0;font-size:13px}
  </style>
</head>
<body>
  <main>
    <span class="badge">Demo Trading</span>
    <h1>LifeOS Trading Intelligence</h1>
    <p>The LosAI Trade AI terminal is available as a simulation environment for testing the trading interface and market-data integration.</p>
    <p><strong>Simulation only.</strong> No real money, broker, or live order execution is provided.</p>
    <a href="/terminal/">Open LosAI Trade AI</a>
  </main>
</body>
</html>
