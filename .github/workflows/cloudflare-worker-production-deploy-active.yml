name: Cloudflare Worker production deploy (active)

# Production deployment trigger: final end-to-end verification of the merged Trading Pages release.
# Deployment verification retrigger: this commit intentionally causes a fresh main push run.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  LIFEOS_PRODUCTION_SITE: https://lifeosai.pages.dev
  LIFEOS_PRODUCTION_API: https://losai-edge-gateway.lifeostecinoai.workers.dev
  LIFEOS_TRADING_PAGES_PROJECT: lifeos-trade-system
  LIFEOS_TRADING_SITE: https://lifeos-trade-system.pages.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out production source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/edge-gateway/package-lock.json

      - name: Install pinned edge toolchain
        run: npm ci --ignore-scripts --prefix services/edge-gateway

      - name: Verify production configuration
        env:
          LIFEOS_ALLOWED_ORIGINS: ${{ secrets.LIFEOS_ALLOWED_ORIGINS }}
          LIFEOS_PUBLIC_SITE_ORIGIN: ${{ secrets.LIFEOS_PUBLIC_SITE_ORIGIN }}
          LIFEOS_API_ORIGIN: ${{ secrets.LIFEOS_API_ORIGIN }}
          ORIGIN_STATE_KV_ID: ${{ secrets.ORIGIN_STATE_KV_ID }}
          RATE_LIMIT_NAMESPACE_ID: ${{ secrets.RATE_LIMIT_NAMESPACE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          required = ["LIFEOS_ALLOWED_ORIGINS","LIFEOS_PUBLIC_SITE_ORIGIN","LIFEOS_API_ORIGIN","SUPABASE_URL","SUPABASE_PUBLISHABLE_KEY","ORIGIN_STATE_KV_ID","RATE_LIMIT_NAMESPACE_ID","GEMINI_API_KEY","TWELVE_DATA_API_KEY","ALPACA_API_KEY","ALPACA_SECRET_KEY","CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID"]
          missing = [x for x in required if not os.environ.get(x, "").strip()]
          if missing: raise SystemExit("Missing required production secret(s): " + ", ".join(missing))
          site = os.environ["LIFEOS_PRODUCTION_SITE"]
          api = os.environ["LIFEOS_PRODUCTION_API"]
          assert os.environ["LIFEOS_PUBLIC_SITE_ORIGIN"].rstrip("/") == site
          assert os.environ["LIFEOS_ALLOWED_ORIGINS"].rstrip("/") == site
          assert os.environ["LIFEOS_API_ORIGIN"].rstrip("/") == api
          print("PRODUCTION_CONFIGURATION=PASS")
          PY

      - name: Verify GitHub Alpaca credentials directly
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          set -euo pipefail
          http="$(curl --silent --show-error --location --max-time 30 \\
            -H "APCA-API-KEY-ID: $ALPACA_API_KEY" \\
            -H "APCA-API-SECRET-KEY: $ALPACA_SECRET_KEY" \\
            'https://data.alpaca.markets/v2/stocks/AAPL/bars?timeframe=1Day&limit=1&feed=iex' \\
            -o "$RUNNER_TEMP/alpaca-credential-check.json" -w '%{http_code}')"
          echo "ALPACA_CREDENTIALS_HTTP=$http"
          test "$http" = "200"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path(os.environ["RUNNER_TEMP"]+"/alpaca-credential-check.json").read_text())
          assert isinstance(d.get("bars"), list) and d["bars"], "Alpaca returned no AAPL bars"
          print("ALPACA_CREDENTIALS=PASS")
          PY

      - name: Verify Worker source
        run: |
          set -euo pipefail
          npm --prefix services/edge-gateway test
          npm --prefix services/edge-gateway run check
          ! grep -RInE --exclude-dir=node_modules 'RENDER_ORIGIN|NORTHFLANK_ORIGIN|losai\.onrender\.com|onrender\.com' services/edge-gateway infrastructure/cloudflare/wrangler.toml.template
          echo "WORKER_SOURCE=PASS"

      - name: Materialize production Wrangler configuration
        env:
          LIFEOS_ALLOWED_ORIGINS: ${{ secrets.LIFEOS_ALLOWED_ORIGINS }}
          LIFEOS_PUBLIC_SITE_ORIGIN: ${{ secrets.LIFEOS_PUBLIC_SITE_ORIGIN }}
          LIFEOS_API_ORIGIN: ${{ secrets.LIFEOS_API_ORIGIN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ORIGIN_STATE_KV_ID: ${{ secrets.ORIGIN_STATE_KV_ID }}
          RATE_LIMIT_NAMESPACE_ID: ${{ secrets.RATE_LIMIT_NAMESPACE_ID }}
        working-directory: services/edge-gateway
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path("../../infrastructure/cloudflare/wrangler.toml.template")
          s=p.read_text()
          vals={"__LIFEOS_ALLOWED_ORIGINS__":os.environ["LIFEOS_ALLOWED_ORIGINS"],"__LIFEOS_PUBLIC_SITE_ORIGIN__":os.environ["LIFEOS_PUBLIC_SITE_ORIGIN"],"__LIFEOS_API_ORIGIN__":os.environ["LIFEOS_API_ORIGIN"],"__SUPABASE_URL__":os.environ["SUPABASE_URL"],"__SUPABASE_PUBLISHABLE_KEY__":os.environ["SUPABASE_PUBLISHABLE_KEY"],"__ORIGIN_STATE_KV_ID__":os.environ["ORIGIN_STATE_KV_ID"],"__RATE_LIMIT_NAMESPACE_ID__":os.environ["RATE_LIMIT_NAMESPACE_ID"]}
          for k,v in vals.items(): s=s.replace(k,v)
          Path("wrangler.toml").write_text(s)
          PY
          test -s wrangler.toml

      - name: Authenticate Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --prefix services/edge-gateway wrangler whoami

      - name: Deploy authoritative Worker with production secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        working-directory: services/edge-gateway
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/lifeos-worker-secrets.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ["RUNNER_TEMP"]+"/lifeos-worker-secrets.json").write_text(
              json.dumps({
                  "GEMINI_API_KEY": os.environ["GEMINI_API_KEY"],
                  "TWELVE_DATA_API_KEY": os.environ["TWELVE_DATA_API_KEY"],
                  "ALPACA_API_KEY": os.environ["ALPACA_API_KEY"],
                  "ALPACA_SECRET_KEY": os.environ["ALPACA_SECRET_KEY"],
              })
          )
          PY
          chmod 600 "$secrets_file"
          npx wrangler deploy --config wrangler.toml --secrets-file "$secrets_file"
          rm -f "$secrets_file"

          deployment_json="$RUNNER_TEMP/worker-deployments.json"
          npx wrangler deployments list --config wrangler.toml --json > "$deployment_json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path(os.environ["RUNNER_TEMP"]+"/worker-deployments.json").read_text())
          if isinstance(d, list):
              deployments=d
          else:
              deployments=d.get("deployments", d.get("result", {}).get("deployments", []))
          if not deployments:
              raise SystemExit("No Worker deployments returned after deploy")
          active=deployments[0]
          versions=active.get("versions") or []
          if len(versions) != 1 or float(versions[0].get("percentage", 0)) != 100:
              raise SystemExit("Production Worker deployment is not a single 100% version: "+repr(versions))
          print("WORKER_ACTIVE_VERSION="+str(versions[0].get("version_id")))
          print("WORKER_ACTIVE_TRAFFIC=100")
          PY

      - name: Verify Trading Pages production environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          project_json="$RUNNER_TEMP/trading-pages-project.json"
          curl --fail --silent --show-error --location --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$LIFEOS_TRADING_PAGES_PROJECT" \
            -o "$project_json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path(os.environ["RUNNER_TEMP"]+"/trading-pages-project.json").read_text())
          assert d.get("success") is True, d
          r=d["result"]
          if r.get("production_branch") != "main":
              raise SystemExit("Trading Pages production branch is not main: "+repr(r.get("production_branch")))
          print("PAGES_PRODUCTION_BRANCH=main")
          print("PAGES_SUBDOMAIN="+str(r.get("subdomain")))
          print("PAGES_PRODUCTION_SCRIPT="+str(r.get("production_script_name")))
          print("PAGES_PREVIEW_SCRIPT="+str(r.get("preview_script_name")))
          print("PAGES_USES_FUNCTIONS="+str(r.get("uses_functions")))
          print("PAGES_FRAMEWORK="+str(r.get("framework")))
          print("PAGES_CANONICAL_DEPLOYMENT="+str((r.get("canonical_deployment") or {}).get("url")))
          print("PAGES_LATEST_DEPLOYMENT="+str((r.get("latest_deployment") or {}).get("url")))
          PY
          curl --fail --silent --show-error --location --max-time 30 \
            -X PATCH \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"production_branch":"main","production_deployments_enabled":false,"build_config":{"build_command":"","destination_dir":".","root_dir":"/"}}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$LIFEOS_TRADING_PAGES_PROJECT" \
            -o "$RUNNER_TEMP/trading-pages-project-updated.json"
          echo "TRADING_PAGES_PRODUCTION_AUTODEPLOY=DISABLED"
          echo "TRADING_PAGES_GIT_API_DEPLOYMENT=AUTHORITATIVE"
          echo "TRADING_PAGES_PRODUCTION_ENVIRONMENT=PASS"

      - name: Verify Trading Pages production deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          create_json="$RUNNER_TEMP/trading-pages-create.json"
          create_json="$RUNNER_TEMP/trading-pages-create.json"
          create_http="$(curl --silent --show-error --location --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Cache-Control: no-cache" \
            -H "Pragma: no-cache" \
            -F "branch=main" \
            -F "commit_hash=$GITHUB_SHA" \
            -F "commit_message=LifeOS Trading System $GITHUB_SHA" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$LIFEOS_TRADING_PAGES_PROJECT/deployments" \
            -o "$create_json" -w '%{http_code}' || true)"
          echo "TRADING_PAGES_API_CREATE_HTTP=$create_http"
          deployment_id=""
          deployment_url=""
          if [ "$create_http" = "200" ]; then
            deployment_id="$(python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path(os.environ["RUNNER_TEMP"]+"/trading-pages-create.json").read_text())
          assert d.get("success") is True, d
          r=d["result"]
          assert r.get("environment") == "production", r
          print(r["id"])
          PY
            )"
            deployment_url="$(python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path(os.environ["RUNNER_TEMP"]+"/trading-pages-create.json").read_text())
          print(d["result"].get("url",""))
          PY
            )"
          elif [ "$create_http" = "304" ]; then
            echo "Cloudflare returned 304; resolving the production deployment by commit SHA."
          else
            cat "$create_json" || true
            exit 1
          fi
          if [ -z "$deployment_id" ]; then
            deployments_json="$RUNNER_TEMP/trading-pages-deployments.json"
            for attempt in $(seq 1 36); do
              curl --silent --show-error --location --max-time 30 \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Cache-Control: no-cache" \
                -w '%{http_code}' \
                -o "$deployments_json" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$LIFEOS_TRADING_PAGES_PROJECT/deployments" > "$RUNNER_TEMP/trading-pages-deployments-http.txt"
              deployments_http="$(cat "$RUNNER_TEMP/trading-pages-deployments-http.txt")"
              if [ "$deployments_http" != "200" ]; then
                echo "TRADING_PAGES_DEPLOYMENTS_LIST_HTTP=$deployments_http"
                cat "$deployments_json" || true
                exit 1
              fi
              echo "TRADING_PAGES_DEPLOYMENTS_LIST_HTTP=200"
              result="$(python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path(os.environ["RUNNER_TEMP"]+"/trading-pages-deployments.json").read_text())
          assert d.get("success") is True, d
          for c in d.get("result", []):
              metadata=((c.get("deployment_trigger") or {}).get("metadata") or {})
              if metadata.get("commit_hash") == os.environ["GITHUB_SHA"] and c.get("environment") == "production" and c.get("latest_stage",{}).get("status") == "success":
                  print(c.get("id","")+"|"+c.get("url",""))
                  break
          PY
              )"
              if [ -n "$result" ]; then
                deployment_id="${result%%|*}"
                deployment_url="${result#*|}"
                break
              fi
              echo "Waiting for successful production Pages deployment for $GITHUB_SHA after 304 (attempt $attempt/36); waiting 5s."
              sleep 5
            done
          fi
          test -n "$deployment_id"
          test -n "$deployment_url"
          echo "TRADING_PAGES_DEPLOYMENT_ID=$deployment_id"
          echo "TRADING_PAGES_DEPLOYMENT_URL=$deployment_url"
          echo "TRADING_PAGES_GIT_API_DEPLOYMENT=PASS"
          canonical_http="$(curl --silent --show-error --location --max-time 30 --output "$RUNNER_TEMP/trading-pages-canonical.html" --write-out '%{http_code}' "$LIFEOS_TRADING_SITE/?v=$GITHUB_SHA" || true)"
          echo "TRADING_PAGES_CANONICAL_HTTP=$canonical_http"
          test "$canonical_http" = "200"
          grep -q "LifeOS Trading Intelligence" "$RUNNER_TEMP/trading-pages-canonical.html"
          grep -q "Demo Trading" "$RUNNER_TEMP/trading-pages-canonical.html"
          terminal_http="$(curl --silent --show-error --location --max-time 30 --output "$RUNNER_TEMP/trading-terminal.html" --write-out '%{http_code}' "$LIFEOS_TRADING_SITE/terminal/?v=$GITHUB_SHA" || true)"
          echo "TRADING_TERMINAL_HTTP=$terminal_http"
          test "$terminal_http" = "200"
          terminal_js_http="$(curl --silent --show-error --location --max-time 30 --output "$RUNNER_TEMP/trading-terminal.js" --write-out '%{http_code}' "$LIFEOS_TRADING_SITE/terminal/terminal.js?v=$GITHUB_SHA" || true)"
          echo "TRADING_TERMINAL_JS_HTTP=$terminal_js_http"
          test "$terminal_js_http" = "200"
          grep -q "Losai Trade AI" "$RUNNER_TEMP/trading-terminal.html"
          grep -q "Simulation only" "$RUNNER_TEMP/trading-terminal.html"
          grep -q "losai-edge-gateway.lifeostecinoai.workers.dev" "$RUNNER_TEMP/trading-terminal.js"
          echo "TRADING_PAGES_DEPLOYMENT=PASS"
          echo "TRADING_TERMINAL_DEPLOYMENT=PASS"

      - name: Smoke test production AAPL OHLC
        env:
          LIFEOS_PRODUCTION_API: ${{ env.LIFEOS_PRODUCTION_API }}
        run: |
          set -euo pipefail
          url="$LIFEOS_PRODUCTION_API/api/market-data?type=stock&symbol=AAPL&interval=1d"
          http="$(curl --silent --show-error --location --max-time 30 "$url" -o "$RUNNER_TEMP/aapl-market-data.json" -w '%{http_code}' || true)"
          echo "AAPL_OHLC_HTTP=$http"
          if [ "$http" != "200" ]; then
            echo "AAPL_OHLC_RESPONSE=$(cat "$RUNNER_TEMP/aapl-market-data.json")"
            exit 1
          fi
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"aapl-market-data.json"
          d=json.loads(p.read_text())
          assert d.get("ok") is True, f"ok={d.get('ok')}"
          assert d.get("source") == "Alpaca", f"source={d.get('source')}"
          assert d.get("symbol") == "AAPL", f"symbol={d.get('symbol')}"
          assert d.get("market_type") == "stock", f"market_type={d.get('market_type')}"
          assert d.get("interval") == "1d", f"interval={d.get('interval')}"
          assert d.get("resolution") == "D", f"resolution={d.get('resolution')}"
          bars=d.get("bars")
          assert isinstance(bars,list) and len(bars) >= 30, f"bars={len(bars) if isinstance(bars,list) else type(bars).__name__}"
          for i,b in enumerate(bars):
              vals=[b.get(k) for k in ("open","high","low","close")]
              assert all(isinstance(v,(int,float)) and math.isfinite(v) for v in vals), f"bar {i} has invalid OHLC"
              o,h,l,c=vals
              assert h >= max(o,c) and l <= min(o,c), f"bar {i} violates OHLC invariants"
              assert isinstance(b.get("timestamp"),str) and b["timestamp"], f"bar {i} missing timestamp"
          print(f"AAPL_OHLC_SMOKE=PASS bars={len(bars)} source=Alpaca resolution=D")
          PY

      - name: Verify live Worker deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: services/edge-gateway
        run: |
          npx wrangler deployments status --config wrangler.toml
          npx wrangler secret list --config wrangler.toml --format json | python -c 'import json,sys; d=json.load(sys.stdin); names={x.get("name") for x in d}; assert "GEMINI_API_KEY" in names; assert "TWELVE_DATA_API_KEY" in names; assert "ALPACA_API_KEY" in names; assert "ALPACA_SECRET_KEY" in names'
          echo "LIVE_WORKER_CONTROL_PLANE=PASS"
