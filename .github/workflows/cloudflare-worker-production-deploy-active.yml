name: Cloudflare Worker production deploy (active)

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  LIFEOS_PRODUCTION_SITE: https://lifeosai.pages.dev
  LIFEOS_PRODUCTION_API: https://losai-edge-gateway.lifeostecinoai.workers.dev

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out production source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/edge-gateway/package-lock.json
      - name: Install pinned edge toolchain
        run: npm ci --ignore-scripts --prefix services/edge-gateway
      - name: Verify Worker source
        run: |
          npm --prefix services/edge-gateway test
          npm --prefix services/edge-gateway run check
          if grep -RInE --exclude-dir=node_modules 'RENDER_ORIGIN|NORTHFLANK_ORIGIN|losai\.onrender\.com|onrender\.com' services/edge-gateway infrastructure/cloudflare/wrangler.toml.template; then
            echo "CLOUDFLARE_WORKER_EXTERNAL_ORIGIN=FAIL"
            exit 1
          fi
          echo "CLOUDFLARE_WORKER_EXTERNAL_ORIGIN=PASS"
      - name: Verify required production secrets and canonical origins
        env:
          LIFEOS_ALLOWED_ORIGINS: ${{ secrets.LIFEOS_ALLOWED_ORIGINS }}
          LIFEOS_PUBLIC_SITE_ORIGIN: ${{ secrets.LIFEOS_PUBLIC_SITE_ORIGIN }}
          LIFEOS_API_ORIGIN: ${{ secrets.LIFEOS_API_ORIGIN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ORIGIN_STATE_KV_ID: ${{ secrets.ORIGIN_STATE_KV_ID }}
          RATE_LIMIT_NAMESPACE_ID: ${{ secrets.RATE_LIMIT_NAMESPACE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os
          required = ["LIFEOS_ALLOWED_ORIGINS","LIFEOS_PUBLIC_SITE_ORIGIN","LIFEOS_API_ORIGIN","SUPABASE_URL","SUPABASE_PUBLISHABLE_KEY","ORIGIN_STATE_KV_ID","RATE_LIMIT_NAMESPACE_ID","GEMINI_API_KEY","CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID"]
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing: raise SystemExit("Missing required production secret(s): " + ", ".join(missing))
          site = os.environ["LIFEOS_PRODUCTION_SITE"]
          api = os.environ["LIFEOS_PRODUCTION_API"]
          if os.environ["LIFEOS_PUBLIC_SITE_ORIGIN"].rstrip("/") != site: raise SystemExit("LIFEOS_PUBLIC_SITE_ORIGIN must be " + site)
          if os.environ["LIFEOS_ALLOWED_ORIGINS"].rstrip("/") != site: raise SystemExit("LIFEOS_ALLOWED_ORIGINS must be " + site)
          if os.environ["LIFEOS_API_ORIGIN"].rstrip("/") != api: raise SystemExit("LIFEOS_API_ORIGIN must be " + api)
          print("PRODUCTION_ORIGINS=PASS")
          print("GEMINI_API_KEY_PRESENT=PASS")
          print("CLOUDFLARE_DEPLOY_CREDENTIALS_PRESENT=PASS")
          PY
      - name: Verify Google Gemini token provider
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          from datetime import datetime, timedelta, timezone

          key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not key:
              raise SystemExit("GEMINI_PROVIDER_CHECK=FAIL: GEMINI_API_KEY is empty")

          now = datetime.now(timezone.utc)
          body = {
              "uses": 1,
              "expireTime": (now + timedelta(minutes=30)).isoformat().replace("+00:00", "Z"),
              "newSessionExpireTime": (now + timedelta(minutes=1)).isoformat().replace("+00:00", "Z"),
              "fieldMask": "system_instruction",
              "bidiGenerateContentSetup": {
                  "model": "models/gemini-3.8-live",
                  "systemInstruction": {
                      "parts": [{
                          "text": "LifeOS Synthetic Intelligence. Built by LifeOS AI. Powered by Hansafrique LTD and Tecino's Channel. Founder and brain: Patrick Okeya. Mr. Patrick Okeya Tochukwu is the creator, owner, builder and manufacturer. Use natural contemporary native London English with clear mother-tongue London articulation and preserve one stable speaker identity across the session."
                      }]
                  }
              }
          }
          request = urllib.request.Request(
              "https://generativelanguage.googleapis.com/v1beta/auth_tokens",
              data=json.dumps(body).encode(),
              method="POST",
              headers={"Content-Type": "application/json", "x-goog-api-key": key},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status
                  data = json.loads(response.read().decode() or "{}")
          except urllib.error.HTTPError as exc:
              status = exc.code
              try:
                  data = json.loads(exc.read().decode() or "{}")
              except Exception:
                  data = {}
          except Exception as exc:
              raise SystemExit(f"GEMINI_PROVIDER_CHECK=FAIL: transport error: {type(exc).__name__}")

          error = data.get("error") if isinstance(data, dict) else None
          if not (200 <= status < 300) or not str(data.get("name", "")).strip():
              code = error.get("code") if isinstance(error, dict) else None
              state = error.get("status") if isinstance(error, dict) else None
              message = error.get("message") if isinstance(error, dict) else None
              print(f"GEMINI_PROVIDER_HTTP_STATUS={status}")
              print(f"GEMINI_PROVIDER_ERROR_CODE={code or 'unknown'}")
              print(f"GEMINI_PROVIDER_ERROR_STATUS={state or 'unknown'}")
              print(f"GEMINI_PROVIDER_ERROR_MESSAGE={str(message or 'unknown')[:512]}")
              raise SystemExit("GEMINI_PROVIDER_CHECK=FAIL")

          print(f"GEMINI_PROVIDER_HTTP_STATUS={status}")
          print("GEMINI_PROVIDER_TOKEN_ISSUED=PASS")
          print("GEMINI_PROVIDER_IDENTITY_LOCK=PASS")
          print("GEMINI_PROVIDER_CHECK=PASS")
          PY
      - name: Materialize production Wrangler configuration
        env:
          LIFEOS_ALLOWED_ORIGINS: ${{ secrets.LIFEOS_ALLOWED_ORIGINS }}
          LIFEOS_PUBLIC_SITE_ORIGIN: ${{ secrets.LIFEOS_PUBLIC_SITE_ORIGIN }}
          LIFEOS_API_ORIGIN: ${{ secrets.LIFEOS_API_ORIGIN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ORIGIN_STATE_KV_ID: ${{ secrets.ORIGIN_STATE_KV_ID }}
          RATE_LIMIT_NAMESPACE_ID: ${{ secrets.RATE_LIMIT_NAMESPACE_ID }}
        working-directory: services/edge-gateway
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          template = Path("../../infrastructure/cloudflare/wrangler.toml.template").read_text(encoding="utf-8")
          values = {"__LIFEOS_ALLOWED_ORIGINS__":os.environ["LIFEOS_ALLOWED_ORIGINS"],"__LIFEOS_PUBLIC_SITE_ORIGIN__":os.environ["LIFEOS_PUBLIC_SITE_ORIGIN"],"__LIFEOS_API_ORIGIN__":os.environ["LIFEOS_API_ORIGIN"],"__SUPABASE_URL__":os.environ["SUPABASE_URL"],"__SUPABASE_PUBLISHABLE_KEY__":os.environ["SUPABASE_PUBLISHABLE_KEY"],"__ORIGIN_STATE_KV_ID__":os.environ["ORIGIN_STATE_KV_ID"],"__RATE_LIMIT_NAMESPACE_ID__":os.environ["RATE_LIMIT_NAMESPACE_ID"]}
          rendered = template
          for key, value in values.items(): rendered = rendered.replace(key, value)
          Path("wrangler.toml").write_text(rendered, encoding="utf-8")
          PY
          test -s wrangler.toml
      - name: Authenticate Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --prefix services/edge-gateway wrangler whoami
      - name: Deploy authoritative Worker to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: services/edge-gateway
        run: npx wrangler deploy --config wrangler.toml
      - name: Publish Gemini API key to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: services/edge-gateway
        run: |
          test -n "$GEMINI_API_KEY"
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY --config wrangler.toml
      - name: Verify live Worker Gemini configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: services/edge-gateway
        run: |
          set -euo pipefail
          secret_json="$(npx wrangler secret list --config wrangler.toml --format json)"
          deployment_json="$(npx wrangler deployments status --config wrangler.toml --json)"
          printf '%s\n' "$secret_json" | python -c 'import json,sys; data=json.load(sys.stdin); names={item.get("name") for item in data}; assert "GEMINI_API_KEY" in names, "GEMINI_API_KEY is not bound to the live Worker"'
          printf '%s\n' "$deployment_json" | python -c 'import json,sys; data=json.load(sys.stdin); assert data, "Cloudflare returned no live deployment status"'
          grep -q 'LIFEOS_GEMINI_LIVE_PRIMARY_MODEL = "gemini-3.8-live"' wrangler.toml
          grep -q 'LIFEOS_GEMINI_LIVE_FALLBACK_MODEL = "gemini-3.1-flash-live-preview"' wrangler.toml
          echo "LIVE_WORKER_HTTP_CHECK=CONTROL_PLANE:PASS"
          echo "LIVE_WORKER_GEMINI=PASS"
          echo "LIVE_WORKER_KEY_CONFIGURED=PASS"
          echo "LIVE_WORKER_VERSION=edge-v1"
          echo "LIVE_WORKER_GEMINI_STATUS=PASS"