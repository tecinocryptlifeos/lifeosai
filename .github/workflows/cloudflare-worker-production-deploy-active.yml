name: Cloudflare Worker production deploy (active)

# Production deployment trigger: run the merged Pages-project detection fix on main.
# Deployment verification retrigger: this commit intentionally causes a fresh main push run.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  LIFEOS_PRODUCTION_SITE: https://lifeosai.pages.dev
  LIFEOS_PRODUCTION_API: https://losai-edge-gateway.lifeostecinoai.workers.dev
  LIFEOS_TRADING_PAGES_PROJECT: lifeos-trade-system
  LIFEOS_TRADING_SITE: https://lifeos-trade-system.pages.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out production source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/edge-gateway/package-lock.json

      - name: Install pinned edge toolchain
        run: npm ci --ignore-scripts --prefix services/edge-gateway

      - name: Verify production configuration
        env:
          LIFEOS_ALLOWED_ORIGINS: ${{ secrets.LIFEOS_ALLOWED_ORIGINS }}
          LIFEOS_PUBLIC_SITE_ORIGIN: ${{ secrets.LIFEOS_PUBLIC_SITE_ORIGIN }}
          LIFEOS_API_ORIGIN: ${{ secrets.LIFEOS_API_ORIGIN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ORIGIN_STATE_KV_ID: ${{ secrets.ORIGIN_STATE_KV_ID }}
          RATE_LIMIT_NAMESPACE_ID: ${{ secrets.RATE_LIMIT_NAMESPACE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          required = ["LIFEOS_ALLOWED_ORIGINS","LIFEOS_PUBLIC_SITE_ORIGIN","LIFEOS_API_ORIGIN","SUPABASE_URL","SUPABASE_PUBLISHABLE_KEY","ORIGIN_STATE_KV_ID","RATE_LIMIT_NAMESPACE_ID","GEMINI_API_KEY","TWELVE_DATA_API_KEY","CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID"]
          missing = [x for x in required if not os.environ.get(x, "").strip()]
          if missing: raise SystemExit("Missing required production secret(s): " + ", ".join(missing))
          site = os.environ["LIFEOS_PRODUCTION_SITE"]
          api = os.environ["LIFEOS_PRODUCTION_API"]
          assert os.environ["LIFEOS_PUBLIC_SITE_ORIGIN"].rstrip("/") == site
          assert os.environ["LIFEOS_ALLOWED_ORIGINS"].rstrip("/") == site
          assert os.environ["LIFEOS_API_ORIGIN"].rstrip("/") == api
          print("PRODUCTION_CONFIGURATION=PASS")
          PY

      - name: Verify Worker source
        run: |
          set -euo pipefail
          npm --prefix services/edge-gateway test
          npm --prefix services/edge-gateway run check
          ! grep -RInE --exclude-dir=node_modules 'RENDER_ORIGIN|NORTHFLANK_ORIGIN|losai\.onrender\.com|onrender\.com' services/edge-gateway infrastructure/cloudflare/wrangler.toml.template
          echo "WORKER_SOURCE=PASS"

      - name: Materialize production Wrangler configuration
        env:
          LIFEOS_ALLOWED_ORIGINS: ${{ secrets.LIFEOS_ALLOWED_ORIGINS }}
          LIFEOS_PUBLIC_SITE_ORIGIN: ${{ secrets.LIFEOS_PUBLIC_SITE_ORIGIN }}
          LIFEOS_API_ORIGIN: ${{ secrets.LIFEOS_API_ORIGIN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ORIGIN_STATE_KV_ID: ${{ secrets.ORIGIN_STATE_KV_ID }}
          RATE_LIMIT_NAMESPACE_ID: ${{ secrets.RATE_LIMIT_NAMESPACE_ID }}
        working-directory: services/edge-gateway
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path("../../infrastructure/cloudflare/wrangler.toml.template")
          s=p.read_text()
          vals={"__LIFEOS_ALLOWED_ORIGINS__":os.environ["LIFEOS_ALLOWED_ORIGINS"],"__LIFEOS_PUBLIC_SITE_ORIGIN__":os.environ["LIFEOS_PUBLIC_SITE_ORIGIN"],"__LIFEOS_API_ORIGIN__":os.environ["LIFEOS_API_ORIGIN"],"__SUPABASE_URL__":os.environ["SUPABASE_URL"],"__SUPABASE_PUBLISHABLE_KEY__":os.environ["SUPABASE_PUBLISHABLE_KEY"],"__ORIGIN_STATE_KV_ID__":os.environ["ORIGIN_STATE_KV_ID"],"__RATE_LIMIT_NAMESPACE_ID__":os.environ["RATE_LIMIT_NAMESPACE_ID"]}
          for k,v in vals.items(): s=s.replace(k,v)
          Path("wrangler.toml").write_text(s)
          PY
          test -s wrangler.toml

      - name: Authenticate Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --prefix services/edge-gateway wrangler whoami

      - name: Deploy authoritative Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: services/edge-gateway
        run: npx wrangler deploy --config wrangler.toml

      - name: Publish Gemini API key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: services/edge-gateway
        run: printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY --config wrangler.toml

      - name: Publish Twelve Data API key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        working-directory: services/edge-gateway
        run: echo "$TWELVE_DATA_API_KEY" | npx wrangler secret put TWELVE_DATA_API_KEY --config wrangler.toml

      - name: Verify Trading Pages production environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          project_json="$RUNNER_TEMP/trading-pages-project.json"
          curl --fail --silent --show-error --location --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$LIFEOS_TRADING_PAGES_PROJECT" \
            -o "$project_json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path(os.environ["RUNNER_TEMP"]+"/trading-pages-project.json").read_text())
          assert d.get("success") is True, d
          r=d["result"]
          if r.get("production_branch") != "main":
              raise SystemExit("Trading Pages production branch is not main: "+repr(r.get("production_branch")))
          print("PAGES_PRODUCTION_BRANCH=main")
          PY
          curl --fail --silent --show-error --location --max-time 30 \
            -X PATCH \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"production_branch":"main","production_deployments_enabled":false}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$LIFEOS_TRADING_PAGES_PROJECT" \
            -o "$RUNNER_TEMP/trading-pages-project-updated.json"
          echo "TRADING_PAGES_PRODUCTION_AUTODEPLOY=DISABLED"
          echo "TRADING_PAGES_MANUAL_DEPLOYMENT=AUTHORITATIVE"
          echo "TRADING_PAGES_PRODUCTION_ENVIRONMENT=PASS"

      - name: Publish Trading System Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/lifeos-trading-pages"
          verify="$RUNNER_TEMP/lifeos-trading-pages-verify"
          rm -rf "$stage" "$verify"; mkdir -p "$stage/assets" "$verify"
          cp web/lifeos_voice/trading.html "$stage/index.html"
          cp web/lifeos_voice/assets/lifeos-home-king-bg.webp "$stage/assets/lifeos-home-king-bg.webp"
          mkdir -p "$stage/terminal"
          cp apps/trade-terminal/index.html "$stage/terminal/index.html"
          cp apps/trade-terminal/terminal.css "$stage/terminal/terminal.css"
          cp apps/trade-terminal/terminal.js "$stage/terminal/terminal.js"
          cp apps/trade-terminal/_headers "$stage/_headers"
          python - <<'PY'
          import json, os
          from pathlib import Path
          cfg={"supabase_url":os.environ["SUPABASE_URL"].rstrip("/"),"supabase_anon_key":os.environ["SUPABASE_PUBLISHABLE_KEY"]}
          Path(os.environ["RUNNER_TEMP"]+"/lifeos-trading-pages/trading-config.js").write_text("window.LIFEOS_TRADING_CONFIG="+json.dumps(cfg,separators=(",",":"))+";")
          PY
          deploy_log="$RUNNER_TEMP/trading-pages-deploy.log"
          npx --prefix services/edge-gateway wrangler pages deploy "$stage" --project-name "$LIFEOS_TRADING_PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-message "Deploy LifeOS Trading System $GITHUB_SHA" 2>&1 | tee "$deploy_log"
          deployment_url="$(grep -Eo 'https://[a-f0-9]+\.lifeos-trade-system\.pages\.dev' "$deploy_log" | tail -n 1 || true)"
          test -n "$deployment_url"
          echo "TRADING_PAGES_DEPLOYMENT_URL=$deployment_url"
          echo "Generated Pages deployment URL is informational; canonical site is the production authority."
          curl --fail --silent --show-error --location --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$LIFEOS_TRADING_PAGES_PROJECT/deployments?per_page=1" \
            -o "$RUNNER_TEMP/trading-pages-latest.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path(os.environ["RUNNER_TEMP"]+"/trading-pages-latest.json").read_text())
          assert d.get("success") is True, d
          rows=d.get("result",[])
          assert rows, "No Trading Pages deployments returned"
          latest=rows[0]
          print("PAGES_LATEST_ENVIRONMENT="+str(latest.get("environment")))
          print("PAGES_LATEST_STAGE="+str(latest.get("latest_stage",{}).get("status")))
          assert latest.get("environment") == "production", latest
          assert latest.get("latest_stage",{}).get("status") == "success", latest
          PY
          echo "TRADING_PAGES_LATEST_DEPLOYMENT=PASS"
          curl --fail --silent --show-error --location --max-time 30 --retry 12 --retry-delay 5 --retry-all-errors --output "$verify/index.html" "$LIFEOS_TRADING_SITE/"
          test -s "$verify/index.html"
          echo "TRADING_CANONICAL_HTTP=200"
          curl --fail --silent --show-error --location --max-time 30 --output "$verify/trading-config.js" "$LIFEOS_TRADING_SITE/trading-config.js"
          grep -q "LifeOS Trading Intelligence" "$verify/index.html"
          grep -q "AI Market Read" "$verify/index.html"
          grep -q "Trade Plan" "$verify/index.html"
          grep -q "Market Structure" "$verify/index.html"
          grep -q "Demo Trading" "$verify/index.html"
          grep -q "Twelve Data" "$verify/index.html"
          grep -q "LIFEOS_TRADING_CONFIG" "$verify/trading-config.js"
          curl --fail --silent --show-error --location --max-time 30 --output "$verify/terminal.html" "$LIFEOS_TRADING_SITE/terminal/"
          curl --fail --silent --show-error --location --max-time 30 --output "$verify/terminal.js" "$LIFEOS_TRADING_SITE/terminal/terminal.js"
          grep -q "Losai Trade AI" "$verify/terminal.html"
          grep -q "Simulation only" "$verify/terminal.html"
          grep -q "losai-edge-gateway.lifeostecinoai.workers.dev" "$verify/terminal.js"
          echo "TRADING_PAGES_DEPLOYMENT=PASS"
          echo "TRADING_TERMINAL_DEPLOYMENT=PASS"

      - name: Smoke test production AAPL OHLC
        env:
          LIFEOS_PRODUCTION_API: ${{ env.LIFEOS_PRODUCTION_API }}
        run: |
          set -euo pipefail
          url="$LIFEOS_PRODUCTION_API/api/market-data?type=stock&symbol=AAPL&interval=1d"
          curl --fail --silent --show-error --location --max-time 30 "$url" -o "$RUNNER_TEMP/aapl-market-data.json"
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"aapl-market-data.json"
          d=json.loads(p.read_text())
          assert d.get("ok") is True, f"ok={d.get('ok')}"
          assert d.get("source") == "Twelve Data", f"source={d.get('source')}"
          assert d.get("symbol") == "AAPL", f"symbol={d.get('symbol')}"
          assert d.get("market_type") == "stock", f"market_type={d.get('market_type')}"
          assert d.get("interval") == "1d", f"interval={d.get('interval')}"
          assert d.get("resolution") == "D", f"resolution={d.get('resolution')}"
          bars=d.get("bars")
          assert isinstance(bars,list) and len(bars) >= 30, f"bars={len(bars) if isinstance(bars,list) else type(bars).__name__}"
          for i,b in enumerate(bars):
              vals=[b.get(k) for k in ("open","high","low","close")]
              assert all(isinstance(v,(int,float)) and math.isfinite(v) for v in vals), f"bar {i} has invalid OHLC"
              o,h,l,c=vals
              assert h >= max(o,c) and l <= min(o,c), f"bar {i} violates OHLC invariants"
              assert isinstance(b.get("timestamp"),str) and b["timestamp"], f"bar {i} missing timestamp"
          print(f"AAPL_OHLC_SMOKE=PASS bars={len(bars)} source=Twelve Data resolution=D")
          PY

      - name: Verify live Worker deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: services/edge-gateway
        run: |
          npx wrangler deployments status --config wrangler.toml
          npx wrangler secret list --config wrangler.toml --format json | python -c 'import json,sys; d=json.load(sys.stdin); assert "GEMINI_API_KEY" in {x.get("name") for x in d}; assert "TWELVE_DATA_API_KEY" in {x.get("name") for x in d}'
          echo "LIVE_WORKER_CONTROL_PLANE=PASS"
