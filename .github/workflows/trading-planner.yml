name: trading-planner
on:
  push:
    paths:
      - "trading_api/**"
      - "trading_intelligence/**"
      - "tests/unit/test_trading_planner_api.py"
      - "requirements-api.txt"
      - "Dockerfile.trading-api"
      - ".github/workflows/trading-planner.yml"
  pull_request:
    paths:
      - "trading_api/**"
      - "trading_intelligence/**"
      - "tests/unit/test_trading_planner_api.py"
      - "requirements-api.txt"
      - "Dockerfile.trading-api"
      - ".github/workflows/trading-planner.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt
      - run: python -m pip install -r requirements-api.txt
      - name: Compile API modules
        run: python -m compileall -q trading_api trading_intelligence
      - name: Run planner unit tests
        run: python -m unittest tests.unit.test_trading_planner_api -v
      - name: Validate Dockerfile exists
        run: test -s Dockerfile.trading-api
